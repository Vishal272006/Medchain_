<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MedChain Verify</title>
<style>
  :root {
    --bg: #0a0f0d;
    --surface: #111a15;
    --border: #1e2e24;
    --text: #e8f0ea;
    --muted: #6b857a;
    --green: #1d9e75;
    --green-light: #9fe1cb;
    --amber: #ef9f27;
    --amber-light: #fac775;
    --red: #e24b4a;
    --red-light: #f7c1c1;
    --accent: #5dcaa5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.25rem 1.5rem 1rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  header h1 {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--accent);
    font-weight: normal;
    text-transform: uppercase;
  }
  header span {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  main { flex: 1; padding: 1.5rem; max-width: 480px; margin: 0 auto; width: 100%; }

  .scanner-box {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    aspect-ratio: 1;
    margin-bottom: 1.5rem;
  }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #canvas { display: none; }

  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .scan-frame {
    width: 55%;
    aspect-ratio: 1;
    position: relative;
  }
  .scan-frame::before, .scan-frame::after,
  .scan-frame span::before, .scan-frame span::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--accent);
    border-style: solid;
  }
  .scan-frame::before  { top:0; left:0;  border-width: 2px 0 0 2px; }
  .scan-frame::after   { top:0; right:0; border-width: 2px 2px 0 0; }
  .scan-frame span::before { bottom:0; left:0;  border-width: 0 0 2px 2px; }
  .scan-frame span::after  { bottom:0; right:0; border-width: 0 2px 2px 0; }

  .scan-line {
    position: absolute;
    left: 10%; right: 10%;
    height: 1px;
    background: var(--accent);
    opacity: 0.7;
    animation: scan 2s linear infinite;
  }
  @keyframes scan {
    0%   { top: 10%; }
    100% { top: 90%; }
  }

  .hint {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
  }

  .btn {
    width: 100%;
    padding: 0.85rem;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    margin-bottom: 0.75rem;
    transition: background 0.15s;
  }
  .btn:hover { background: rgba(93,202,165,0.08); }
  .btn:active { background: rgba(93,202,165,0.15); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 1.25rem 0;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 0.75rem;
    border-radius: 2px;
    resize: vertical;
    min-height: 80px;
    margin-bottom: 0.75rem;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  /* Result card */
  #result { display: none; margin-top: 1.5rem; }

  .verdict-banner {
    padding: 1.25rem 1.5rem;
    border-radius: 2px;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .verdict-banner.ACCEPT { background: rgba(29,158,117,0.12); border: 1px solid var(--green); }
  .verdict-banner.FLAG   { background: rgba(239,159,39,0.12); border: 1px solid var(--amber); }
  .verdict-banner.REJECT { background: rgba(226,75,74,0.12);  border: 1px solid var(--red); }

  .verdict-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .ACCEPT .verdict-icon { background: rgba(29,158,117,0.2); color: var(--green-light); }
  .FLAG   .verdict-icon { background: rgba(239,159,39,0.2);  color: var(--amber-light); }
  .REJECT .verdict-icon { background: rgba(226,75,74,0.2);   color: var(--red-light); }

  .verdict-text h2 {
    font-size: 15px;
    font-weight: normal;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .ACCEPT .verdict-text h2 { color: var(--green-light); }
  .FLAG   .verdict-text h2 { color: var(--amber-light); }
  .REJECT .verdict-text h2 { color: var(--red-light); }

  .verdict-text p {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 1rem;
  }
  .info-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.75rem;
  }
  .info-cell .label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .info-cell .value {
    font-size: 13px;
    color: var(--text);
    word-break: break-word;
  }

  .sensor-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .sensor-block h3 {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    font-weight: normal;
  }
  .sensor-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .sensor-row:last-child { border-bottom: none; }
  .sensor-row .sk { color: var(--muted); }
  .sensor-row .sv { }
  .sv.ok     { color: var(--green-light); }
  .sv.warn   { color: var(--amber-light); }
  .sv.breach { color: var(--red-light); }

  .status-line {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 1rem;
    text-align: center;
  }

  #status-msg {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 0.5rem 0;
    min-height: 24px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>MedChain Verify</h1>
  <span>v1.0</span>
</header>

<main>
  <div class="scanner-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay">
      <div class="scan-frame">
        <span></span>
        <div class="scan-line"></div>
      </div>
    </div>
  </div>

  <p class="hint">Point camera at medicine batch QR code</p>

  <button class="btn" id="startBtn" onclick="startCamera()">Start Camera</button>
  <button class="btn" id="stopBtn" onclick="stopCamera()" style="display:none">Stop Camera</button>

  <div id="status-msg">Camera inactive</div>

  <div class="divider">or paste QR data manually</div>

  <textarea id="manualInput" placeholder='Paste raw JSON from QR here...'></textarea>
  <button class="btn" onclick="verifyManual()">Verify Pasted Data</button>

  <div id="result">
    <div class="verdict-banner" id="verdictBanner">
      <div class="verdict-icon" id="verdictIcon"></div>
      <div class="verdict-text">
        <h2 id="verdictText"></h2>
        <p id="verdictReason"></p>
      </div>
    </div>

    <div class="info-grid" id="infoGrid"></div>

    <div class="sensor-block" id="sensorBlock" style="display:none">
      <h3>Transit Sensor Log</h3>
      <div id="sensorRows"></div>
    </div>

    <p class="status-line" id="sigStatus"></p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
  const API = window.location.origin;
  let stream = null;
  let scanLoop = null;

  const video  = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx    = canvas.getContext("2d");

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }
      });
      video.srcObject = stream;
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("stopBtn").style.display  = "block";
      setStatus("Scanning...");
      scanLoop = requestAnimationFrame(tick);
    } catch(e) {
      setStatus("Camera access denied — use manual paste below");
    }
  }

  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    cancelAnimationFrame(scanLoop);
    document.getElementById("startBtn").style.display = "block";
    document.getElementById("stopBtn").style.display  = "none";
    setStatus("Camera inactive");
  }

  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code    = jsQR(imgData.data, imgData.width, imgData.height);
      if (code) {
        setStatus("QR detected — verifying...");
        stopCamera();
        callVerify(code.data);
        return;
      }
    }
    scanLoop = requestAnimationFrame(tick);
  }

  function verifyManual() {
    const raw = document.getElementById("manualInput").value.trim();
    if (!raw) { setStatus("Paste QR JSON data first"); return; }
    callVerify(raw);
  }

  async function callVerify(qrData) {
    setStatus("Contacting MedChain server...");
    try {
      const res = await fetch(`${API}/verify`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ qr_data: qrData })
      });
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const data = await res.json();
      showResult(data);
    } catch(e) {
      setStatus("Cannot reach server — verifying offline...");
      offlineVerify(qrData);
    }
  }

  function offlineVerify(qrData) {
    try {
      const payload = JSON.parse(qrData);
      const hasSig  = !!payload.signature;
      const expiry  = payload.expiry_date || "";
      let months = 99;
      if (expiry) {
        const [y, m] = expiry.split("-").map(Number);
        const now = new Date();
        months = (y - now.getFullYear()) * 12 + (m - (now.getMonth() + 1));
      }
      const verdict = !hasSig ? "REJECT" : months < 0 ? "REJECT" : months < 1 ? "FLAG" : "ACCEPT";
      const reason  = !hasSig ? "No signature found in QR" :
                      months < 0 ? `Expired (${expiry})` :
                      months < 1 ? `Expires this month — use immediately` :
                      `${months} month(s) to expiry`;
      showResult({
        verdict, reason,
        batch_id:  payload.batch_id,
        drug_name: payload.drug_name,
        quantity:  payload.quantity,
        sender:    payload.sender_id,
        receiver:  payload.receiver_id,
        signature_valid: hasSig,
        _offline: true
      });
    } catch {
      setStatus("Invalid QR data — cannot parse");
    }
  }

  function showResult(data) {
    const v = data.verdict;
    const icons = { ACCEPT: "✓", FLAG: "!", REJECT: "✕" };

    const banner = document.getElementById("verdictBanner");
    banner.className = `verdict-banner ${v}`;

    document.getElementById("verdictIcon").textContent = icons[v];
    document.getElementById("verdictText").textContent = v;
    document.getElementById("verdictReason").textContent = data.reason || "";

    const fields = [
      ["Batch ID",    data.batch_id   || "—"],
      ["Drug",        data.drug_name  || "—"],
      ["Quantity",    data.quantity   ? `${data.quantity} units` : "—"],
      ["Sender",      data.sender     || "—"],
      ["Receiver",    data.receiver   || "—"],
      ["Expires in",  data.days_to_expiry_approx != null ? `~${data.days_to_expiry_approx} days` : "—"]
    ];

    document.getElementById("infoGrid").innerHTML = fields.map(([l, v]) => `
      <div class="info-cell">
        <div class="label">${l}</div>
        <div class="value">${v}</div>
      </div>`).join("");

    const ss = data.sensor_summary;
    if (ss) {
      const sensorBlock = document.getElementById("sensorBlock");
      sensorBlock.style.display = "block";
      const clean = ss.transit_clean;
      const readingRows = (ss.readings || []).map(reading => `
        <div class="sensor-row"><span class="sk">${reading.temp_c ?? "—"} °C · ${reading.humidity_pct ?? "—"}% RH · ${reading.light_exposed ? "Light exposed" : "Dark"}</span><span class="sv ${reading.status === "BREACH" ? "breach" : "ok"}">${reading.status || "UNKNOWN"}</span></div>
      `).join("");
      document.getElementById("sensorRows").innerHTML = `
        <div class="sensor-row"><span class="sk">Total readings</span><span class="sv">${ss.total_readings}</span></div>
        <div class="sensor-row"><span class="sk">Breach events</span><span class="sv ${ss.breach_count > 0 ? 'breach' : 'ok'}">${ss.breach_count}</span></div>
        <div class="sensor-row"><span class="sk">Transit status</span><span class="sv ${clean ? 'ok' : 'breach'}">${clean ? "CLEAN" : "COMPROMISED"}</span></div>
        ${readingRows || `<div class="sensor-row"><span class="sk">ESP32 readings</span><span class="sv">Waiting for first reading</span></div>`}
      `;
    } else {
      document.getElementById("sensorBlock").style.display = "none";
    }

    const sigOk = data.signature_valid;
    document.getElementById("sigStatus").textContent =
      sigOk
        ? (data._offline ? "⚠ Offline mode — signature not cryptographically verified" : "Signature verified ✓")
        : "Signature invalid — possible forgery";
    document.getElementById("sigStatus").style.color =
      sigOk && !data._offline ? "var(--green-light)" :
      data._offline ? "var(--amber-light)" : "var(--red-light)";

    document.getElementById("result").style.display = "block";
    setStatus(data._offline ? "Offline verification complete" : "Verification complete");
  }

  function setStatus(msg) {
    document.getElementById("status-msg").textContent = msg;
  }
</script>
</body>
</html>
